# Global parameters applied to all images in this chart
global:
  imageRegistry: ""
  imagePullSecrets: []

# Replace the name of the chart defined in Chart.yaml
nameOverride: ""

# Replace the generated name (release+chart name)
fullnameOverride: ""

# If true, CRD resources will be installed as part of the Helm chart release.
installCRDs: true

# If true, CRD resources will be uninstalled as part of the Helm chart release uninstallation.
# Uninstalling CRD resources will DELETE all related custom resources.
uninstallCRDs: false

# Restrict network access to controller and buildkit pods
enableNetworkPolicies: true

# Applied to all pods
podAnnotations: {}
podLabels: {}
podEnv: {}

clusterDomain: cluster.local

# Certificate configuration
certificate:
  # CA certificate duration (210 days = 5040h)
  # This duration helps prevent cert-manager race conditions where leaf certs
  # can be issued with ca.crt fields pointing to expired CAs.
  # See: https://github.com/cert-manager/cert-manager/issues/5851
  caDuration: 5040h

# Istio configuration
istio:
  # Enable support for environments with Istio installed
  enabled: false
  # Elevate pod execution permissions so that Istio's init container can modify
  # network settings when CNI plugin is NOT installed.
  cni: false
  # In ambient mode, network policies are amended to include port 15008. This
  # does have the side effect of allowing access to all container ports.
  ambient: false

# New Relic APM configuration
newRelic:
  # Enable monitoring
  enabled: false
  # Application name
  appName: hephaestus
  # Account API key
  licenseKey: ""
  # Tag metadata added to metrics
  labels: {}

# Configuration for buildkit and controller that adds the ability to pull/push images
# from/to insecure (self-signed TLS) and http registries.
registries: {}
  # myserver:
  #   insecure: true
  #   http: true

# Controller configuration
controller:
  # Number of instances to run. Leader election will be enabled whenever this
  # value is greater than 1; this ensures that only one instance is active at
  # any given time.
  replicaCount: 1

  # Service account configuration
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  # Metrics configuration
  metrics:
    # Enable the export of prometheus metrics
    enabled: true
    # Allow ingress traffic from prometheus pods with the following labels
    podLabels:
      app.kubernetes.io/name: prometheus
    # Namespace labels where prometheus is running if different from app's namespace
    namespaceLabels: {}

  # Configure controller pod security context
  podSecurityContext:
    runAsNonRoot: true
    # nonroot
    runAsUser: 65532
    seLinuxOptions:
      type: spc_t

  # Annotations for controller pods
  podAnnotations: {}

  # Extra labels for controller pods
  podLabels: {}

  # Tolerations for controller pod assignment
  tolerations: []

  # Affinities for controller pod assignment
  affinity: {}

  # Node labels for controller pod assignment
  nodeSelector: {}
  # Node selector for Job pods. Defaults to nodeSelector if not set.
  jobNodeSelector: {}

  # Controller pods priorityClassName
  priorityClassName: ""

  # Additional volumes
  extraVolumes: []

  # Additional volume mounts added to both the manager and vector containers
  extraVolumeMounts: []

  # Enable service links injection into pod environment variables
  enableServiceLinks: false

  # Manager configuration
  manager:
    # Manager image (default image tag is the chart appVersion)
    image:
      registry: ghcr.io
      repository: dominodatalab/hephaestus
      tag: ""
      pullPolicy: IfNotPresent
      pullSecrets: []

    imageBuild:
      # Maximum number of concurrent builds which can be run
      concurrency: 5
      historyLimit: 5
      # interval to run garbage collection in hours default 1 hour
      interval: 1

    # Webhook server port
    webhookPort: 9443

    # Prometheus metric ports
    metricsPort: 8080

    # Health probe port
    healthProbePort: 8081

    # Limit watch to a specific set of namespaces, default is all namespaces
    watchNamespaces: []

    # Duration after which buildkit cluster is inspected for idle pods
    # Defaults to "30s"
    poolSyncWaitTime: null

    # Duration after which idle buildkit pods will be terminated
    # Defaults to "10m"
    poolMaxIdleTime: null

    # Duration the worker pool will wait for a buildkit pod to become ready for traffic
    # Defaults to 180
    poolEndpointWatchTimeout: null

    # Duration the build will wait to fetch and extract the remote Docker context.
    # Defaults to 4.25 mins for fetch retries and an unlimited amount of time to extract.
    fetchAndExtractTimeout: null

    # Global secrets (name: path) to expose into all image builds
    secrets: {}

    # Cloud-based registry credentials configuration
    cloudRegistryAuth:
      # Azure credentials required to access ACR
      azure:
        enabled: false
        tenantID: ""
        clientID: ""
        clientSecret: ""
        workloadIdentity: false
      # GCP credentials required to access GCR
      gcp:
        enabled: false
        serviceAccount: ""
        # For accessing from non-GKE installs
        mountedCredentials:
          secretName: ""
          keyName: ""

    # Build status messaging configuration
    messaging:
      # Enable message publisher
      enabled: false
      # Remote AMQP server configuration
      amqp:
        url: "amqp://user:password@rabbitmq.default:5672"
        exchange: ""
        queue: "hephaestus.imagebuilds.status"
      # Remote Kafka cluster configuration
      kafka: {}

    # Manager logging configuration
    logging:
      # Level at which stacktraces are printed can be either 'info', 'error', or 'panic'
      stacktraceLevel: error
      # Logs sent to stdout/stderr
      container:
        # Level can be 'debug', 'info', 'error', or any integer value >= 0 which corresponds to custom debug levels of increasing verbosity
        level: info
        # Defaults to 'console' but can also be 'json'
        encoding: console
      # Logs sent to JSON file for post-processing. These logs are only produced when log processor is enabled
      logfile:
        level: info

    # Configure manager container security context
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    # Extra environment variables provided to the manager container
    extraEnvVars: []

    # Additional volume mounts added to the manager container
    extraVolumeMounts: []

    # Resource requests and limits
    resources:
      requests: {}
      limits: {}

  # Log processor configuration
  vector:
    # Enable log processing sidecar container
    enabled: true

    # Vector image
    image:
      registry: ""
      repository: timberio/vector
      tag: 0.54.0-distroless-static
      pullPolicy: IfNotPresent
      pullSecrets: []

    # Configure the transformation and delivery of your logs using "hephaestus_output" as the name of your input
    config:
      # See https://vector.dev/docs/reference/configuration/transforms/
      transforms: {}
      # See https://vector.dev/docs/reference/configuration/sinks/
      sinks:
        stdout:
          type: console
          inputs:
            - hephaestus_output
          encoding:
            codec: json

    # Additional volume mounts added to the vector container
    extraVolumeMounts: []

    # Resource requests and limits
    resources:
      requests: {}
      limits: {}

# Buildkit cluster configuration
buildkit:
  # Run buildkit in rootless mode
  rootless: true

  # UID for rootless user in rootless mode
  # NOTE: You MUST have a custom image if using anything other than 1000
  rootlessUser: 1000

  # Amount of storage GC keeps locally (bytes). This value should be less than the
  # total amount of available persistent storage (e.g. 75% of 20Gi)
  gcKeepStorage: 15000000000

  # Enable debug logging
  debug: false

  # Add a ConfigMap containing custom CAs if you need to push images to one or
  # more registries that use self-signed certificates
  customCABundle: ""

  # Buildkit image
  image:
    registry: ""
    repository: moby/buildkit
    tag: v0.30.0
    pullPolicy: IfNotPresent
    pullSecrets: []

  # Buildkit image
  rootlessImage:
    registry: ""
    repository: moby/buildkit
    tag: v0.30.0-rootless
    pullPolicy: IfNotPresent
    pullSecrets: []

  # Enable service links injection into pod environment variables
  enableServiceLinks: false

  # Peristent build cache settings
  persistence:
    enabled: true
    pvcRetentionPolicy:
      whenDeleted: "Delete"
      whenScaled: "Retain"
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    annotations: {}

  # Buildkitd liveness probe
  livenessProbe:
    failureThreshold: 3
    initialDelaySeconds: 5
    periodSeconds: 30
    successThreshold: 1
    timeoutSeconds: 30

  # Buildkitd readiness probe
  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 5
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5

  # Resource requests and limits
  resources:
    requests: {}
    limits: {}

  # Control client/server mTLS settings
  mtls:
    enabled: true

  # gRPC API service settings
  service:
    type: ClusterIP
    port: 1234
    portName: daemon

  # Service account configuration
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  # Non-rootless container's securityContext
  containerSecurityContext:
    allowPrivilegeEscalation: true
    privileged: true

  # Rootless container security context (sans user/group)
  rootlessContainerSecurityContext:
    runAsNonRoot: true
    privileged: true
    seccompProfile:
      type: Unconfined

  # Number of buildkit pods to run
  replicaCount: 0

  # Extra labels for buildkit pods
  podLabels: {}

  # Annotations for buildkit pods
  podAnnotations: {}

  # Tolerations for buildkit pod assignment
  tolerations: []

  # Node labels for buildkit pod assignment
  nodeSelector: {}

  # Buildkit pods priorityClassName
  priorityClassName: ""

  # Buildkit container extra args, i.e ["--oci-worker-snapshotter=fuse-overlayfs"]
  args: []

  # Affinities for buildkit pod assignment
  affinity: |-
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/instance
                  operator: In
                  values:
                    - {{ .Release.Name }}
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - {{ .Chart.Name }}
            topologyKey: "topology.kubernetes.io/zone"
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/instance
                  operator: In
                  values:
                    - {{ .Release.Name }}
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - {{ .Chart.Name }}
            topologyKey: "kubernetes.io/hostname"

  # Declares one or more named buildkit pools and the platforms each can serve (natively or via
  # emulation - see binfmt below). Leave empty (the default) to deploy the single buildkit
  # StatefulSet/Service/ServiceAccount/ConfigMap/NetworkPolicy this chart has always deployed, as an
  # implicit, un-platform-aware "default" pool - the pre-multi-arch behavior, byte-for-byte.
  #
  # Setting this deploys ONE StatefulSet/Service/ServiceAccount/ConfigMap/NetworkPolicy PER entry
  # instead, each named "<release>-hephaestus-buildkit-<name>". Only placement/sizing can be
  # overridden per pool (nodeSelector, tolerations, affinity, resources, replicaCount,
  # priorityClassName, args, podLabels, podAnnotations) - every other buildkit.* setting (image,
  # rootless mode, mTLS, service port, persistence) is shared across every pool. namespace defaults
  # to this release's namespace but can be set independently per pool if that pool's StatefulSet
  # should live elsewhere; the buildkit NetworkPolicy is generated to allow controller ingress
  # either way. statefulSetName/serviceName are NOT set here - they're always derived from `name`,
  # so there's no way for the values file and the actually-deployed object names to drift apart.
  #
  # Example - two native pools, each pinned to nodes of the matching architecture:
  # platformPools:
  #   - name: amd64
  #     platforms: ["linux/amd64"]
  #     nodeSelector:
  #       kubernetes.io/arch: amd64
  #   - name: arm64
  #     platforms: ["linux/arm64"]
  #     nodeSelector:
  #       kubernetes.io/arch: arm64
  #     tolerations:
  #       - key: dedicated
  #         operator: Equal
  #         value: buildkit-arm64
  #         effect: NoSchedule
  #
  # See docs/building.md in the hephaestus repo for the single-pool-with-emulation alternative,
  # which needs no more than one pool declared here plus binfmt.enabled below.
  platformPools: []

  # Registers QEMU user-mode emulation handlers (via tonistiigi/binfmt, by default) in every buildkit
  # pod, letting a single buildkit pool solve for non-native platforms (e.g. requesting linux/arm64
  # on an amd64 node). This is what makes a platformPools entry listing more than one platform
  # actually work when there's no natively-matching hardware - without it, a non-native platform
  # request will fail at solve time even though admission validation allowed it (validation only
  # checks that some pool *declares* the platform, it can't verify emulation is actually registered).
  #
  # Runs as a privileged initContainer on each buildkit pod rather than a separate DaemonSet:
  # registration writes to /proc/sys/fs/binfmt_misc, which is not mount-namespaced, so a privileged
  # container's registration is visible to the host kernel without needing to run anywhere but here.
  # This also means it always lands on the same nodes buildkit itself does, with no separate
  # nodeSelector/tolerations to keep in sync.
  binfmt:
    enabled: false
    image:
      registry: ""
      repository: tonistiigi/binfmt
      tag: latest
      pullPolicy: IfNotPresent

# waitForNetworking starts an initContainer that requires a curl_image
# Set this to true in istio ambient mode to cause Hephaestus Manager to start up
# with networking. We're not sure why this works. See: https://dominodatalab.atlassian.net/browse/DOM-70981
waitForNetworking: false
curl_image: curlimages/curl:latest
