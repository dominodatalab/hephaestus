{{- if .Values.enableNetworkPolicies }}
{{- $pools := .Values.buildkit.platformPools }}
{{- if not $pools }}
{{- $pools = list (dict "name" "" "implicit" true) }}
{{- end }}
{{- range $i, $pool := $pools }}
{{- $poolCtx := dict "root" $ "pool" $pool }}
{{- $controllerNamespace := "" }}
{{- if not $pool.implicit }}
{{- $controllerNamespace = $.Release.Namespace }}
{{- end }}
{{- $args := dict
      "root" $
      "name" (include "hephaestus.buildkit.pool.fullname" $poolCtx)
      "namespace" (include "hephaestus.buildkit.pool.namespace" $poolCtx)
      "standardLabels" (include "hephaestus.buildkit.pool.labels.standard" $poolCtx)
      "matchLabels" (include "hephaestus.buildkit.pool.labels.matchLabels" $poolCtx)
      "controllerNamespace" $controllerNamespace
-}}
{{- if $i }}
---
{{ include "hephaestus.buildkit.networkpolicy.render" $args }}
{{- else -}}
{{- include "hephaestus.buildkit.networkpolicy.render" $args }}
{{- end }}
{{- end }}
{{- end }}
