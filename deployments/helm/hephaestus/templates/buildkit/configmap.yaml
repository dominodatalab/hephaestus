{{- $pools := .Values.buildkit.platformPools }}
{{- if not $pools }}
{{- $pools = list (dict "name" "" "implicit" true) }}
{{- end }}
{{- range $i, $pool := $pools }}
{{- $poolCtx := dict "root" $ "pool" $pool }}
{{- $args := dict
      "root" $
      "name" (include "hephaestus.buildkit.pool.fullname" $poolCtx)
      "namespace" (include "hephaestus.buildkit.pool.namespace" $poolCtx)
      "standardLabels" (include "hephaestus.buildkit.pool.labels.standard" $poolCtx)
-}}
{{- if $i }}
---
{{ include "hephaestus.buildkit.configmap.render" $args }}
{{- else -}}
{{- include "hephaestus.buildkit.configmap.render" $args }}
{{- end }}
{{- end }}
