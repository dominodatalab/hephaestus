{{- if .Values.enableNetworkPolicies }}
{{- range .Values.buildkit.platformPools }}
{{- $pool := . }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hephaestus.buildkit.pool.fullname" (dict "root" $ "pool" $pool) }}
  namespace: {{ include "hephaestus.buildkit.pool.namespace" (dict "root" $ "pool" $pool) }}
  labels:
    {{- include "hephaestus.buildkit.pool.labels.standard" (dict "root" $ "pool" $pool) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hephaestus.buildkit.pool.labels.matchLabels" (dict "root" $ "pool" $pool) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ $.Values.buildkit.service.port }}
          protocol: TCP
        {{- if $.Values.istio.ambient }}
        - port: 15008 # Allow Istio Ambient mode's HBONE traffic
          protocol: TCP
        {{- end }}
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "hephaestus.controller.labels.matchLabels" $ | nindent 14 }}
{{- end }}
{{- end }}
