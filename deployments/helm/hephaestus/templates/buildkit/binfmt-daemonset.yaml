{{- if .Values.buildkit.binfmt.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "hephaestus.buildkit.fullname" . }}-binfmt
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: binfmt
spec:
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: binfmt
  template:
    metadata:
      labels:
        {{- include "common.labels.matchLabels" . | nindent 8 }}
        app.kubernetes.io/component: binfmt
    spec:
      {{- include "hephaestus.imagePullSecrets" . | indent 6 }}
      # Registration writes to /proc/sys/fs/binfmt_misc, which is not mount-namespaced - a
      # privileged container's registration is visible to the host kernel without any special
      # volume mounts or host namespace sharing.
      initContainers:
        - name: binfmt
          image: {{ include "hephaestus.buildkit.binfmt.image" . }}
          imagePullPolicy: {{ .Values.buildkit.binfmt.image.pullPolicy }}
          args: ["--install", "all"]
          securityContext:
            privileged: true
      containers:
        - name: pause
          image: {{ include "hephaestus.buildkit.binfmt.image" . }}
          imagePullPolicy: {{ .Values.buildkit.binfmt.image.pullPolicy }}
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 10m
              memory: 32Mi
      {{- /* With a single implicit pool, defaults to buildkit's own nodeSelector/tolerations so the
      binfmt DaemonSet lands on the same nodes as the buildkit pods it registers emulation for.
      With multiple explicit pools there's no single obvious pool to inherit placement from (they
      may target entirely different node pools), so it defaults to unrestricted (all nodes) unless
      explicitly set - harmless, since registering emulation on a node that doesn't need it is a
      no-op cost, not a correctness problem. */}}
      {{- $binfmtNodeSelector := .Values.buildkit.binfmt.nodeSelector }}
      {{- if and (not $binfmtNodeSelector) (not .Values.buildkit.platformPools) }}
      {{- $binfmtNodeSelector = .Values.buildkit.nodeSelector }}
      {{- end }}
      {{- with $binfmtNodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $binfmtTolerations := .Values.buildkit.binfmt.tolerations }}
      {{- if and (not $binfmtTolerations) (not .Values.buildkit.platformPools) }}
      {{- $binfmtTolerations = .Values.buildkit.tolerations }}
      {{- end }}
      {{- with $binfmtTolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
